name: CI

on:
  # Branches only: a tag runs these jobs through the Release workflow, before its builds.
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow in the name: the checks a release runs (Release) never cancel those of a push.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, tests, vulnerabilities, front end
    # Pinned: ubuntu-latest moves to a new Ubuntu release from time to time.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK4 and WebKitGTK 6.0 (the window, built with cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config
      - run: make frontend-install
      - run: make frontend-browsers
      - run: make check

  integration:
    name: Container tests (WordPress, WP-CLI and SSH)
    # Pinned like the job above; Docker is preinstalled on this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-integration
