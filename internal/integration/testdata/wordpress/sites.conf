# The fixture sites over HTTP, by name: updates.example.test serves ~vigie/sites/updates. Other
# names (127.0.0.1) go to the default site, which holds the packages of fixture-packages.
<VirtualHost *:80>
	ServerName fixtures.example.test
	ServerAlias *.example.test
	VirtualDocumentRoot /home/vigie/sites/%1
	<Directory /home/vigie/sites>
		AllowOverride All
		Require all granted
	</Directory>
</VirtualHost>
